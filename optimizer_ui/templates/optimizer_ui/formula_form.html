<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
</head>
<body>

<h1>{{ title }}</h1>

<p>
    Plant:
    <strong>{{ plant.name }}</strong>
</p>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Formula
    </button>

</form>

<br>

<a href="{% url 'optimizer_ui:formula_list' plant.id %}">
    Back to Formulas
</a>

</body>
</html>
