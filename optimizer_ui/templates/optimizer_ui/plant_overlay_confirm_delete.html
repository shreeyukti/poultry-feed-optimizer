<h1>Delete Overlay</h1>

<p>
    Are you sure you want to delete this overlay?
</p>

<p>
    <strong>Plant:</strong> {{ plant.name }} <br>
    <strong>Ingredient:</strong> {{ overlay.ingredient_master.name }} <br>
    <strong>Nutrient:</strong> {{ overlay.nutrient.name }} <br>
    <strong>Value:</strong> {{ overlay.value }}
</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<br>

<a href="{% url 'optimizer_ui:plant_overlay_list' plant.id %}">
    Cancel
</a>
