{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>NutriOpt Login</title>
    <link rel="stylesheet" href="{% static 'optimizer_ui/css/style.css' %}">
</head>
<body class="login-body">

<div class="login-page">

    <div class="login-logo">
        <img src="{% static 'optimizer_ui/images/logo.png' %}" alt="NutriOpt">
    </div>

    <div class="login-title">
        <h1>Intelligent Feed</h1>
        <h2>Optimization Platform</h2>
    </div>

    <div class="login-card">
        <h2>Sign in</h2>

        {% if error %}
            <p class="login-error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <div class="remember-row">
                <input type="checkbox" name="remember_me" id="remember_me">
                <label for="remember_me">Remember me</label>
            </div>

            <button type="submit">Sign in</button>
        </form>

        <p class="login-help">Need access? Contact administrator</p>
    </div>

</div>

</body>
</html>
