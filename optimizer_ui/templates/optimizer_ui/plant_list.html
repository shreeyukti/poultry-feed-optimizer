<h1>Select Plant</h1>

{% for plant in plants %}
    <div style="border:1px solid #ccc; padding:15px; margin-bottom:15px;">
        <h2>{{ plant.name }}</h2>
        <p>{{ plant.company.name }}</p>
        <p>{{ plant.location }}</p>

        <a href="{% url 'optimizer_ui:formula_list' plant.id %}">
            Open Formulas
        </a>

        <br><br>

        <a href="{% url 'optimizer_ui:plant_overlay_list' plant.id %}">
            Manage Overlays
        </a>
    </div>
{% empty %}
    <p>No plants found.</p>
{% endfor %}

<a href="{% url 'optimizer_ui:dashboard' %}">
    ← Back to Dashboard
</a>
