<!DOCTYPE html>
<html>
<head>
    <title>Delete Ingredient</title>
</head>
<body>

<h1>Delete Ingredient</h1>

<p>
    Are you sure you want to delete:
    <strong>{{ ingredient.ingredient }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">
        Delete
    </button>
</form>

<br>

<a href="{% url 'optimizer_ui:formula_detail' ingredient.formula.id %}">
    Cancel
</a>

</body>
</html>
