
{% extends "optimizer_ui/base.html" %}

{% block title %}{{ title }} — NutriOpt{% endblock %}

{% block nav_plants %}active{% endblock %}

{% block content %}

<div class="page-header-row">

    <div class="page-header">
        <h1>{{ title }}</h1>

        <p>
            Formula:
            <strong>{{ formula.name }}</strong>
        </p>
    </div>

</div>

<div class="card form-card">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">

            <button type="submit" class="btn">
                Save Nutrient Requirement
            </button>

            <a href="{% url 'optimizer_ui:formula_detail' formula.id %}"
               class="btn btn-secondary">

                Back to Formula

            </a>

        </div>

    </form>

</div>

{% endblock %}
