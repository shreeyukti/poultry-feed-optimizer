{% extends "optimizer_ui/base.html" %}

{% block title %}{{ title }} — NutriOpt{% endblock %}

{% block nav_maintenance %}active{% endblock %}

{% block content %}

<div class="page-header-row">

    <div class="page-header">
        <h1>{{ title }}</h1>
        <p>
            Ingredient: <strong>{{ ingredient.name }}</strong>
        </p>
    </div>

</div>

<div class="card form-card">

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">

            <button type="submit" class="btn">
                Save
            </button>

            <a href="{% url 'optimizer_ui:base_nutrient_list' ingredient.id %}"
               class="btn btn-secondary">

                Back to Base Nutrient Values

            </a>

        </div>

    </form>

</div>

{% endblock %}
